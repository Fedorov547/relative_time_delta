[project]
name = "relative-time-delta"
version = "0.1.1"
description = "Converts relative time phrases like \"third Wednesday\" into concrete datetimes using a given base date."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
